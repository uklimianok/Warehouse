spring.application.name=demo

spring.jpa.hibernate.ddl-auto=validate

spring.datasource.url=jdbc:postgresql://localhost:8281/warehouse_db
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8286/realms/warehouse

spring.security.oauth2.client.registration.keycloak.client-id=warehouse-app
spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=client_credentials
spring.security.oauth2.client.provider.keycloak.token-uri=http://localhost:8286/realms/warehouse/protocol/openid-connect/token

spring.kafka.bootstrap-servers=localhost:8283
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.warehouse.demo.event.*

logging.file.name=logs/app.log
logging.level.org.springframework.aop=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

warehouse.shared-password=${SHARED_PASSWORD}
warehouse.keycloak.admin-url=http://localhost:8286/admin/realms/warehouse

debug=true